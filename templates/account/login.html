{% extends 'base.html' %}
{% block title %}Sign In — Skill Exchange{% endblock %}
{% block content %}
<div class="auth-wrap">
  <div class="auth-card">
    <div class="text-center mb-4">
      <div class="auth-icon-wrap mx-auto mb-3">
        <i class="bi bi-mortarboard-fill"></i>
      </div>
      <h4 class="fw-800 mb-1">Welcome Back!</h4>
      <p class="text-muted small">Sign in to continue your skill exchange journey.</p>
    </div>

    <a href="/accounts/google/login/" class="btn-google mb-2">
      <svg width="20" height="20" viewBox="0 0 48 48">
        <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
        <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
        <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
        <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.18 1.48-4.97 2.31-8.16 2.31-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
      </svg>
      Continue with Google
    </a>

    <div class="or-divider"><span>or sign in with username</span></div>

    <form method="post" action="/login/">
      {% csrf_token %}
      <div class="mb-3">
        <label class="sx-label">Username</label>
        <input type="text" name="username" class="sx-input" placeholder="Enter your username" required>
      </div>
      <div class="mb-4">
        <label class="sx-label">Password</label>
        <input type="password" name="password" class="sx-input" placeholder="Enter your password" required>
      </div>
      <button type="submit" class="btn-sx w-100">
        <i class="bi bi-box-arrow-in-right me-2"></i>Sign In
      </button>
    </form>

    <p class="text-center mt-3 small text-muted">
      Don't have an account?
      <a href="/register/" class="sx-link">Register →</a>
    </p>
  </div>
</div>
{% endblock %}
